name: Trivy SBOM Scan

on:
  schedule:
    # Run every day at 04:30 UTC
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions: read-all

jobs:
  scan-sbom:
    uses: platform-mesh/.github/.github/workflows/job-trivy-sbom.yml@068efd5c6c7a6d0c4b28f5887de7ca156cb5f7b8 # main
    permissions:
      contents: read
      packages: read
      security-events: write
